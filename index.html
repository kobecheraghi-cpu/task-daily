<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مرکز فرماندهی مطالعه</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16202b;--mut:#5f6b78;--line:#dde2e8;--ac:#0e6e8c;--acs:#dff1f6;--p0:#c0392b;--p1:#c77d0a;--p2:#4f6fa8;--p3:#7a8591;--ok:#2a8a57;color-scheme:light}
[data-t=dark]{--bg:#0e141b;--card:#171f29;--ink:#e6ebf0;--mut:#9aa6b2;--line:#2b3644;--ac:#52b4d1;--acs:#183543;--p0:#ef7a6b;--p1:#e3a64a;--p2:#86a4d8;--p3:#9aa6b2;--ok:#5cc58b;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}.row>label select,.row>label input{display:inline-block;width:auto}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 Vazirmatn,IRANSans,"Segoe UI",Tahoma,system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:4}
nav button{white-space:nowrap;border:0;background:none;color:var(--mut);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}nav button.on{background:var(--acs);color:var(--ac);font-weight:700}
main{max-width:1000px;margin:0 auto;padding:16px}h2{font-size:21px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:13px}
button,input,select,textarea{font:inherit;color:var(--ink)}input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;max-width:100%}
textarea{width:100%;min-height:70px}label{display:block;margin-bottom:8px}label input,label select,label textarea{display:block;width:100%}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:5px 11px;cursor:pointer}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.d{color:var(--p0)}.btn.s{padding:2px 8px;font-size:13px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}.bar.m i{background:var(--ok)}
.tk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.tk:last-child{border:0}.tk.dn .tt{text-decoration:line-through;color:var(--mut)}.tk>div{flex:1}
.b{display:inline-block;font-size:12px;border-radius:5px;padding:0 7px;border:1px solid currentColor;margin-inline-start:4px}.p0{color:var(--p0)}.p1{color:var(--p1)}.p2{color:var(--p2)}.p3{color:var(--p3)}
.blk{display:flex;gap:10px;padding:6px 10px;border-inline-start:4px solid var(--line);margin:4px 0;background:var(--bg);border-radius:6px}.blk.fixed{border-color:var(--ac)}.blk.study{border-color:var(--ok)}.blk.leisure{border-color:var(--p1)}.blk.buffer{border-color:var(--p3);opacity:.85}.blk.optional{border-style:dashed}.blk.meal{border-color:var(--p2)}.blk time{min-width:92px;direction:ltr;text-align:right;color:var(--mut);font-size:13px}.blk>div{flex:1}
.stg{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}.stg label{display:flex;gap:5px;align-items:center;margin:0;font-size:13px}.stg input{width:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(440px,94vw)}dialog::backdrop{background:#0008}
#toast{position:fixed;bottom:16px;inset-inline-start:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.warn{background:#c77d0a22;border:1px solid var(--p1);border-radius:8px;padding:8px 12px;margin-bottom:10px}.emp{text-align:center;color:var(--mut);padding:18px}
table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:6px;border-bottom:1px solid var(--line)}.big{font-size:30px;font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>مرکز فرماندهی مطالعه</h1><div class="row"><span id="sv" class="mut"></span><button class="btn s" data-a="theme" aria-label="تغییر پوسته">☾ / ☀</button></div></header>
<nav id="nav"></nav><main id="m"></main><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
'use strict';
const KEY='study_app_v1',SUBJ=['شیمی','حسابان','هندسه','آمار و احتمال','فیزیک'],STG=['ویدیو دیده شد','مفهوم فهمیده شد','تمرین و تست انجام شد','مرور شد','مسلط شد'],
PRI=['بحرانی','مهم','قابل‌تعویق','اختیاری'],DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'],
MODES={full:['هدف کامل',180],min:['حداقل مؤثر',90],rec:['بازیابی',105],rest:['روز استراحت',0]},
TYPES={fixed:'ثابت (محافظت‌شده)',study:'مطالعه',meal:'وعده/استراحت',leisure:'تفریح',buffer:'بافر',optional:'اختیاری'},
LT=['فیلم و سریال','تلگرام و دوستان','یوتیوب','اسکرول شبکه‌های اجتماعی','بازی','بیرون رفتن/دید و بازدید','استراحت بی‌برنامه'],
SC=[['A','خروج ناگهانی ۱۸ تا ۲۰',null,['تسک بحرانی امروز را به بازه‌ی ۲۰:۴۵ ببر.','بلوک آخر و تسک‌های اختیاری را حذف کن.','فردا طبق برنامه‌ی عادی؛ بدون جبران اضافه.']],
['B','امتحان مدرسه‌ی فردا',null,['درس امتحان را بحرانی کن و ۲ تا ۳ بلوک بده.','سایر درس‌ها فقط در حد حداقل.','بعد از امتحان یک روز سبک و سپس برنامه‌ی عادی.']],
['C','مهمانی یا مهمانی خانوادگی','min',['روز را «حداقل» بگیر: یک بلوک ۴۵ دقیقه‌ای قبل از رفتن.','تسک‌های قابل‌تعویق و اختیاری حذف شوند.','تسک مهم را به جمعه ببر.']],
['D','اهمال‌کاری (قابل‌اجتناب)',null,['تسک بحرانی را همان شب با نسخه‌ی کوچک‌تر انجام بده.','یک تأمل دو دقیقه‌ای بنویس.','پیامد را از پیشنهادهای ملایم انتخاب کن؛ اجباری نیست.']],
['E','خستگی واقعی','min',['روز را حداقل یا استراحت کن و زود بخواب.','فقط یک تسک ۳۰ دقیقه‌ای نگه دار.','فردا با سطح حداقل شروع کن.']],
['F','از دست دادن یک روز کامل','rec',['۳۰ دقیقه تریاژ: تسک‌های عقب‌افتاده را اولویت‌بندی کن.','فقط بحرانی‌ها را در روز بازیابی انجام بده.','قابل‌تعویق‌ها به هفته‌ی بعد؛ اختیاری‌ها حذف.']],
['G','هفته‌ی سنگین امتحان و تکلیف','min',['«هفته‌ی بحران» اعلام کن: حدود ۹۰ دقیقه در روز.','علم داده ثابت می‌ماند.','هفته‌ی بعد تدریجی برگرد.']]];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),uid=()=>Math.random().toString(36).slice(2,9),
iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)},
today=()=>iso(new Date()),didx=s=>(pd(s).getDay()+1)%7,wk=s=>add(s,-didx(s)),tm=s=>{const[a,b]=s.split(':');return+a*60+ +b},
pf=(s,o)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).formatToParts(pd(s)).map(x=>[x.type,x.value]));return[p.weekday&&p.weekday+'،',p.day,p.month,p.year].filter(Boolean).join(' ')},pdate=s=>pf(s,{year:'numeric',month:'long',day:'numeric'}),
hm=m=>fa(Math.floor(m/60))+':'+fa(String(m%60).padStart(2,'0')),dur=m=>m>=60?fa(Math.floor(m/60))+' ساعت'+(m%60?' و '+fa(m%60)+' دقیقه':''):fa(m)+' دقیقه';
const DEADLINE='2027-07-22';
function defBlocks(){const b=[],a=(day,s,e,title,type)=>b.push({id:uid(),day,s,e,title,type});
const m=[['فیزیک',null],['حسابان','شیمی'],['شیمی','هندسه'],['هندسه','آمار و احتمال'],['فیزیک','آمار و احتمال']];
for(let d=0;d<5;d++){a(d,'07:00','14:00','مدرسه','fixed');a(d,'14:00','15:30','رفت‌وآمد، ناهار و استراحت','meal');a(d,'15:30',d?'17:15':'17:00','مطالعه: '+m[d][0]+' (یادگیری + تمرین)','study');
if(d){a(d,'17:45','20:00','پنجره‌ی تفریح و خروج (جابه‌جاپذیر)','leisure');a(d,'20:00','20:45','شام','meal');a(d,'20:45','21:30','مطالعه: '+m[d][1]+' (تمرین/مرور)','study');a(d,'21:30','22:15',d==4?'تکلیف مدرسه یا مرور سبک':'مرور تجمعی یا تکلیف مدرسه','study');a(d,'22:15','22:45','بافر و آماده‌ی خواب','buffer')}
else{a(d,'17:30','18:45','شام و استراحت','meal');a(d,'19:00','22:30','علم داده و کدنویسی','fixed')}}
a(5,'10:00','12:00','آزمون یک درس + تحلیل خطا','study');a(5,'12:30','14:00','ناهار و استراحت','meal');a(5,'14:00','18:00','علم داده و کدنویسی','fixed');
a(6,'10:00','12:30','مرور هفتگی و جبران درس عقب‌مانده','study');a(6,'17:00','18:30','بلوک اختیاری','optional');a(6,'19:00','21:30','تفریح و خانواده','leisure');
b.forEach(x=>{if(x.type=='fixed')x.locked=1});return b}
const def=()=>({v:1,theme:'light',start:today(),blocks:defBlocks(),tasks:[
{id:uid(),t:'ثبت فصل‌ها و جلسه‌های ماز در بخش دروس',desc:'پیشنهاد اولیه (قابل ویرایش)',cat:'برنامه‌ریزی',due:today(),dur:30,pri:1,done:0,fb:'فقط یک درس را شروع کن',cond:'حداقل یک درس تعریف شده',pre:''},
{id:uid(),t:'اولین تمرین پایتون را انجام بده',desc:'پیشنهاد اولیه (قابل ویرایش)',cat:'علم داده',due:today(),dur:45,pri:2,done:0,fb:'',cond:'',pre:''}],
subj:Object.fromEntries(SUBJ.map(s=>[s,{chapters:[{id:uid(),n:'فصل ۱',lessons:[],st:[0,0,0,0,0],at:[],tests:[]}],goal:0}])),
ds:{topic:'Python',goals:'',items:[],notes:''},ci:{},log:{},leisure:[],exc:[],reviews:{},
set:{target:180,limit:120,wake:'07:00',wakeGoal:'06:00',sleep:'23:00',dur:45},ui:{tab:'today',subj:SUBJ[0],tf:'today',fp:'',fc:'',day:null}});
let S;function load(){try{const p=JSON.parse(localStorage.getItem(KEY));S=norm(p)}catch(e){S=def()}}
function norm(p){const d=def();if(!p||typeof p!=='object')return d;const r={...d,...p};['set','ui','ds'].forEach(k=>r[k]={...d[k],...(p[k]||{})});
['tasks','blocks','leisure','exc'].forEach(k=>{if(!Array.isArray(r[k]))r[k]=d[k]});['ci','log','reviews','subj'].forEach(k=>{if(!r[k]||typeof r[k]!=='object')r[k]=d[k]});
SUBJ.forEach(s=>{if(!r.subj[s]||!Array.isArray(r.subj[s].chapters))r.subj[s]=d.subj[s];r.subj[s].chapters.forEach(c=>{c.lessons=c.lessons||[];c.st=c.st||[0,0,0,0,0];c.at=c.at||[];c.tests=c.tests||[]})});return r}
let st;function save(){try{localStorage.setItem(KEY,JSON.stringify(S));$('#sv').textContent='ذخیره شد ✓';clearTimeout(st);st=setTimeout(()=>$('#sv').textContent='',1500)}catch(e){toast('ذخیره‌سازی ممکن نشد (حافظه‌ی مرورگر پر یا بسته است).')}}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
function form(title,fields,cb){const d=$('#dlg');d.returnValue='';d.innerHTML=`<form method="dialog"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return`<option value="${esc(v)}"${String(f.v)==String(v)?' selected':''}>${esc(l)}</option>`}).join('')}</select>`:f.a?`<textarea name="${f.k}">${esc(f.v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}"${f.t=='number'?' min="0"':''}>`}</label>`).join('')}<div class="row"><button class="btn p" value="ok">ذخیره</button><button class="btn" value="x" formnovalidate>انصراف</button></div></form>`;
d.onclose=()=>{if(d.returnValue==='ok'){const v=Object.fromEntries(new FormData(d.querySelector('form')));const e=cb(v);if(e)toast(e);else{save();render()}}};d.showModal()}
const bar=(p,c='')=>`<div class="bar ${c}" role="progressbar" aria-valuenow="${Math.round(p)}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`,pc=(a,b)=>b?Math.round(100*a/b):0;
const TABS=[['today','امروز'],['week','برنامه‌ی هفتگی'],['courses','دروس'],['tasks','تسک‌ها'],['deadline','ددلاین'],['ds','علم داده'],['exc','استثناها و پیامد'],['leisure','تفریح'],['review','مرور هفتگی'],['settings','تنظیمات']];
function render(){document.documentElement.dataset.t=S.theme;$('#nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-v="${t[0]}"${S.ui.tab==t[0]?' class="on" aria-current="page"':''}>${t[1]}</button>`).join('');$('#m').innerHTML=V[S.ui.tab]();}
const mode=d=>(S.ci[d]||{}).mode||'full',target=d=>MODES[mode(d)][1]*(S.set.target/180)|0;
const dayBlocks=d=>S.blocks.filter(b=>b.day==didx(d)).sort((a,b)=>tm(a.s)-tm(b.s));
const blk=(b,ed)=>`<div class="blk ${b.type}"><time>${hm(tm(b.s))}–${hm(tm(b.e))}</time><div>${esc(b.title)} <span class="mut">${TYPES[b.type]}</span></div>${ed?(b.locked?'<span class="mut">🔒</span>':`<button class="btn s" data-a="be" data-id="${b.id}">ویرایش</button><button class="btn s d" data-a="bd" data-id="${b.id}">حذف</button>`):''}</div>`;
const tkRow=t=>`<div class="tk${t.done?' dn':''}"><input type="checkbox" data-c="tg" data-id="${t.id}"${t.done?' checked':''} aria-label="انجام شد"><div><div class="tt">${esc(t.t)}<span class="b p${t.pri}">${PRI[t.pri]}</span></div><div class="mut">${esc(t.cat||'')}${t.due?' · '+pdate(t.due):''}${t.dur?' · '+dur(t.dur):''}${t.cond?' · شرط تکمیل: '+esc(t.cond):''}${t.fb?' · نسخه‌ی کوچک: '+esc(t.fb):''}${t.pre?' · پیش‌نیاز: '+esc(t.pre):''}</div>${t.desc?`<div class="mut">${esc(t.desc)}</div>`:''}</div><div class="row"><button class="btn s" data-a="te" data-id="${t.id}">ویرایش</button><button class="btn s" data-a="tp" data-id="${t.id}">+۱ روز</button><button class="btn s d" data-a="td" data-id="${t.id}">حذف</button></div></div>`;
const overdue=()=>S.tasks.filter(t=>!t.done&&t.due&&t.due<today());
const V={
today(){const d=today(),tg=target(d),ac=S.log[d]||0,tk=S.tasks.filter(t=>!t.done||t.due==d).filter(t=>t.due==d).sort((a,b)=>a.pri-b.pri),od=overdue(),c=S.ci[d]||{},ev=S.tasks.filter(t=>!t.done&&t.due>d&&t.due<=add(d,3));
return`<h2>${pf(d,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</h2>
<div class="card"><div class="row sp"><div><div class="big">${dur(ac)}</div><span class="mut">از هدف امروز: ${dur(tg)} (${MODES[mode(d)][0]})</span></div><div class="row"><button class="btn" data-a="lg" data-v="15">+۱۵ دقیقه</button><button class="btn" data-a="lg" data-v="45">+۴۵ دقیقه</button><button class="btn" data-a="lgc">ثبت دستی</button></div></div>${bar(pc(ac,tg))}
<div class="row" style="margin-top:10px"><label style="margin:0">حالت امروز <select data-c="mode">${Object.entries(MODES).map(([k,v])=>`<option value="${k}"${mode(d)==k?' selected':''}>${v[0]}</option>`).join('')}</select></label><button class="btn" data-a="ci">چک‌این روزانه</button></div>
${c.energy?`<div class="mut">انرژی: ${esc(c.energy)} · وقت آزاد: ${esc(c.avail||'—')} · مهم‌ترین تسک: ${esc(c.top||'—')} · حواس‌پرتی: ${esc(c.dist||'—')}</div>`:''}</div>
${od.length?`<div class="warn">${fa(od.length)} تسک عقب‌افتاده داری. این‌ها خودکار به امروز منتقل نمی‌شوند؛ در «تسک‌ها» بازبینی و اولویت‌بندی کن.</div>`:''}
<div class="g"><div class="card"><h3>تسک‌های امروز</h3><form data-f="qa" class="row"><input name="t" placeholder="تسک جدید..." required style="flex:1"><select name="pri">${PRI.map((p,i)=>`<option value="${i}"${i==1?' selected':''}>${p}</option>`).join('')}</select><button class="btn p">افزودن</button></form>${tk.length?tk.map(tkRow).join(''):'<div class="emp">تسکی برای امروز نیست. یکی اضافه کن یا استراحت کن.</div>'}</div>
<div class="card"><h3>برنامه‌ی امروز</h3>${dayBlocks(d).map(b=>blk(b)).join('')||'<div class="emp">بلوکی نیست.</div>'}</div></div>
<div class="card"><h3>در راه</h3>${ev.length?ev.map(t=>`<div>${esc(t.t)} <span class="mut">${pdate(t.due)}</span></div>`).join(''):'<span class="mut">در سه روز آینده تسکی با موعد نیست.</span>'}</div>`},
week(){const d=S.ui.day??didx(today()),cf=conflicts();
